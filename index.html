body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}

['Bài hát đội ca của Đội máu Giao thông là gì?','Lá cờ.'],
['Ngày thành lập của Đội máu Giao thông?','19/03/1995.'],
['Họ và tên đầy đủ của Đội trưởng Đội máu Giao thông?','Anh Nguyễn Minh Tuấn'],
['Chương trình hiến máu toàn trường của Đội máu Giao thông tên là gì?','Khoảnh Khắc.'],
['Slogan của Đội máu Hành chính là gì?','Sống hết mình – Chinh phục ước mơ'],
['Đội trưởng Đội máu Hành chính là ai?','Chị Lê Bích Phượng'],
['Ngày thành lập CLB Thanh niên vận động hiến máu Học viện Hành chính Quốc gia là?','Ngày 10/5/2008.'],
['Đội ca Đội máu Hành chính là bài hát nào?','Võ đường trúc lâm']]
};
var names=Object.keys(D),cur=names[0],list=[],i=0,known={};
var mode="flip",score=0,tried=0;
try{known=JSON.parse(localStorage.getItem("k085")||"{}")}catch(e){known={}}
function $(id){return document.getElementById(id)}
function save(){try{localStorage.setItem("k085",JSON.stringify(known))}catch(e){}}
function key(c){return c[0]}
function build(keepOrder){
  var all=D[cur].slice();
  if(!keepOrder)list=all;
  if($("only").checked)list=list.filter(function(c){return !known[key(c)]});
  i=Math.min(i,Math.max(list.length-1,0));
  show();
}
function show(){
  var c=list[i];
  $("card").classList.remove("flip");
  var all=D[cur],k=all.filter(function(x){return known[key(x)]}).length;
  $("bar").style.width=(all.length?k*100/all.length:0)+"%";
  $("cnt").textContent="Đã thuộc "+k+"/"+all.length;
  if(!c){$("q").textContent="Bạn đã thuộc hết nhóm này.";$("a").textContent="Bỏ chọn “Chỉ thẻ chưa thuộc” để ôn lại.";$("pos").textContent="";$("know").textContent="Đã thuộc";$("quiz").textContent=mode==="quiz"?"Bạn đã thuộc hết nhóm này.":"";return}
  $("q").textContent=c[0];$("a").textContent=c[1];
  if(mode==="quiz")quiz(c);
  $("pos").textContent="Thẻ "+(i+1)+"/"+list.length;
  var kn=!!known[key(c)];
  $("know").textContent=kn?"Bỏ đánh dấu":"Đã thuộc";
  $("know").className=kn?"":"know";
}
function sh(a){a=a.slice();for(var j=a.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),t=a[j];a[j]=a[r];a[r]=t}return a}
function quiz(c){
  var same=D[cur].map(function(x){return x[1]}).filter(function(x){return x!==c[1]});
  var d=sh(same).slice(0,3);
  if(d.length<3){Object.keys(D).forEach(function(n){D[n].forEach(function(x){if(x[1]!==c[1]&&d.indexOf(x[1])<0&&same.indexOf(x[1])<0)d.push(x[1])})});d=sh(d).slice(0,3)}
  var opts=sh([c[1]].concat(d)),box=$("quiz");
  box.innerHTML="";
  var q=document.createElement("p");q.className="qq";q.textContent=c[0];box.appendChild(q);
  var sc=document.createElement("div");sc.className="sc";sc.textContent="Đúng "+score+"/"+tried;
  var btns=[];
  opts.forEach(function(o){
    var b=document.createElement("button");b.className="opt";b.textContent=o;btns.push(b);
    b.onclick=function(){
      tried++;if(o===c[1])score++;
      btns.forEach(function(x){x.disabled=true;if(x.textContent===c[1])x.classList.add("right")});
      if(o!==c[1])b.classList.add("wrong");
      sc.textContent="Đúng "+score+"/"+tried;
    };
    box.appendChild(b);
  });
  box.appendChild(sc);
}
function setMode(m){
  mode=m;
  $("m1").setAttribute("aria-pressed",m==="flip");
  $("m2").setAttribute("aria-pressed",m==="quiz");
  document.querySelector(".scene").hidden=m==="quiz";
  $("quiz").hidden=m!=="quiz";
  if(m==="quiz"){score=0;tried=0}
  show();
}
$("m1").onclick=function(){setMode("flip")};
$("m2").onclick=function(){setMode("quiz")};
function tabs(){
  $("tabs").innerHTML="";
  names.forEach(function(n){
    var b=document.createElement("button");b.textContent=n;
    b.setAttribute("aria-pressed",n===cur);
    b.onclick=function(){cur=n;i=0;tabs();build()};
    $("tabs").appendChild(b);
  });
}
function go(d){if(!list.length)return;i=(i+d+list.length)%list.length;show()}
$("card").onclick=function(){$("card").classList.toggle("flip")};
$("prev").onclick=function(){go(-1)};
$("next").onclick=function(){go(1)};
$("know").onclick=function(){
  var c=list[i];if(!c)return;
  if(known[key(c)])delete known[key(c)];else{known[key(c)]=1;save();
    if($("only").checked){list.splice(i,1);i=Math.min(i,list.length-1);show();return}
    go(1);return}
  save();show();
};
$("shuf").onclick=function(){
  for(var j=list.length-1;j>0;j--){var r=Math.floor(Math.random()*(j+1)),t=list[j];list[j]=list[r];list[r]=t}
  i=0;show();
};
$("only").onchange=function(){i=0;build()};
$("reset").onclick=function(){known={};save();build()};
document.onkeydown=function(e){
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "&&e.target.tagName!=="BUTTON"&&e.target.tagName!=="INPUT"){e.preventDefault();$("card").classList.toggle("flip")}
};
tabs();build();
</script>
</body>
</html>
